<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="48%" stop-color="#0f294a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="78%" cy="32%" r="36%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunCore" x1="890" y1="55" x2="970" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="820" y1="120" x2="1050" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="70" y1="255" x2="640" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="320" rx="24" fill="url(#sky)"/>
  <rect width="1200" height="320" rx="24" fill="url(#sunGlow)"/>

  <!-- Subtle Stars -->
  <g fill="#e0f2fe" opacity="0.75">
    <circle cx="110" cy="52" r="1.8"/>
    <circle cx="240" cy="36" r="1.2"/>
    <circle cx="380" cy="68" r="1.5"/>
    <circle cx="520" cy="40" r="1.9"/>
    <circle cx="660" cy="74" r="1.3"/>
    <circle cx="740" cy="44" r="1.6"/>
    <circle cx="1090" cy="64" r="1.8"/>
    <circle cx="1140" cy="120" r="1.3"/>
    <circle cx="80" cy="140" r="1.1"/>
  </g>

  <!-- Rain Streaks Decorative Right -->
  <g stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <line x1="870" y1="215" x2="858" y2="250"/>
    <line x1="910" y1="222" x2="898" y2="262"/>
    <line x1="955" y1="215" x2="943" y2="252"/>
    <line x1="995" y1="224" x2="983" y2="260"/>
    <line x1="1035" y1="214" x2="1023" y2="248"/>
  </g>

  <!-- Sun & Cloud Emblem -->
  <circle cx="935" cy="108" r="46" fill="url(#sunCore)"/>
  <path d="M845 206h178a36 36 0 0 0 5.5-71.5A49 49 0 0 0 854 128a36 36 0 0 0-9 78Z" fill="url(#cloudGrad)"/>
  <polygon points="942,175 918,210 936,210 926,244 964,200 944,200" fill="#fde047"/>

  <!-- Glass Pill Badge -->
  <rect x="74" y="64" width="190" height="32" rx="16" fill="rgba(16,185,129,0.18)" stroke="rgba(52,211,153,0.55)" stroke-width="1.2"/>
  <circle cx="96" cy="80" r="4.5" fill="#34d399"/>
  <text x="112" y="85" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">LIVE REAL-TIME</text>

  <!-- Title & Subtitle -->
  <text x="74" y="168" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="5">ATMOS</text>
  <text x="76" y="206" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Interactive Real-Time Weather Observatory &amp; 60fps Sky Engine</text>

  <!-- Decorative Telemetry Curve -->
  <path d="M76 264 C 170 230, 260 284, 360 248 C 460 212, 540 272, 648 238" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="360" cy="248" r="5.5" fill="#ffffff" stroke="#fbbf24" stroke-width="3"/>
</svg>
